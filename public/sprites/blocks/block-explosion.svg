<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Black border (2px) with rounded corners -->
  <rect x="0" y="0" width="32" height="32" rx="3" ry="3" fill="#000000"/>
  <!-- Gray stone fill with rounded corners -->
  <rect x="2" y="2" width="28" height="28" rx="2" ry="2" fill="#808080"/>
  <!-- Bold pixel X mark -->
  <line x1="6" y1="6" x2="26" y2="26" stroke="#000000" stroke-width="3" stroke-linecap="square"/>
  <line x1="26" y1="6" x2="6" y2="26" stroke="#000000" stroke-width="3" stroke-linecap="square"/>
  <!-- Additional X pixels for boldness -->
  <line x1="7" y1="6" x2="27" y2="26" stroke="#000000" stroke-width="2" stroke-linecap="square"/>
  <line x1="25" y1="6" x2="5" y2="26" stroke="#000000" stroke-width="2" stroke-linecap="square"/>
</svg>
