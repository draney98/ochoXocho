<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Dark blue-gray background -->
  <rect x="0" y="0" width="64" height="64" fill="#2A2F3A"/>
  
  <!-- Subtle grid pattern (very subtle) -->
  <!-- Horizontal lines -->
  <line x1="0" y1="0" x2="64" y2="0" stroke="#3A3F4A" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="16" x2="64" y2="16" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="64" x2="64" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.3"/>
  
  <!-- Vertical lines -->
  <line x1="0" y1="0" x2="0" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.3"/>
  <line x1="16" y1="0" x2="16" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="48" y1="0" x2="48" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="0" x2="64" y2="64" stroke="#3A3F4A" stroke-width="1" opacity="0.3"/>
  
  <!-- Subtle corner accent -->
  <rect x="0" y="0" width="2" height="2" fill="#4A4F5A" opacity="0.2"/>
  <rect x="62" y="0" width="2" height="2" fill="#4A4F5A" opacity="0.2"/>
  <rect x="0" y="62" width="2" height="2" fill="#4A4F5A" opacity="0.2"/>
  <rect x="62" y="62" width="2" height="2" fill="#4A4F5A" opacity="0.2"/>
</svg>
