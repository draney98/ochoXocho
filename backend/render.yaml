databases:
  - name: ocho-xocho-db
    databaseName: ochoxocho
    user: ochoxocho

services:
  - type: web
    name: ocho-xocho-api
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ocho-xocho-db
          property: connectionString

